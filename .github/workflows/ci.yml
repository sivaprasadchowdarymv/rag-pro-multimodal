name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: "Install text pipeline + test tools (ColPali is faked in tests, no torch needed)"
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes $(git ls-files '*.py' | grep -v '^tests/fakes/')
      - name: "Tests, offline (fake LLM server, fake embedders, fake ColPali)"
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image (with ColPali extras, weights not baked)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: PRELOAD_COLPALI=
          tags: rag-pro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
