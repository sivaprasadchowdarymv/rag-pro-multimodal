# Deploys to your Hugging Face Space after CI passes on main.
# One-time setup in GitHub: repo -> Settings -> Secrets and variables -> Actions
#   Secret   HF_TOKEN  = Hugging Face token with WRITE access
#   Variable HF_SPACE  = <hf-username>/<space-name>     e.g. your-hf-username/rag-pro-multimodal
name: Deploy to Hugging Face Space

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Space folder
        run: python spaces/build_space.py --out space_build
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space_build
          git init -q -b main
          git lfs install --local
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
